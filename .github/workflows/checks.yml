name: LudusAtlas checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.4"

jobs:
  fork-boundaries:
    name: LudusAtlas fork boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/ci/check-fork-boundaries.mjs

  typescript:
    name: TypeScript, unit tests, and frontend build
    runs-on: ubuntu-latest
    needs: fork-boundaries
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test typecheck build

  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    needs: fork-boundaries
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
