name: Build LudusAtlas Windows preview

on:
  workflow_dispatch:

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.4"

jobs:
  build-windows-preview:
    name: Build Windows preview artifact
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check LudusAtlas fork boundaries
        run: node scripts/ci/check-fork-boundaries.mjs

      - name: Check desktop version sync
        run: node scripts/ci/check-desktop-version-sync.mjs

      - name: Run tests and frontend builds
        run: pnpm turbo run test typecheck build

      - name: Build Windows NSIS installer
        run: |
          pnpm --filter @playcounter/shared build
          corepack pnpm --filter @playcounter/desktop exec tauri build --ci --bundles nsis

      - name: Stage preview installer and checksum
        id: artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node scripts/ci/read-desktop-version.mjs
          $application = Join-Path $env:GITHUB_WORKSPACE "apps\desktop\src-tauri\target\release\ludusatlas.exe"
          if (-not (Test-Path -LiteralPath $application -PathType Leaf)) {
            throw "Expected LudusAtlas executable at $application."
          }

          $bundle = Join-Path $env:GITHUB_WORKSPACE "apps\desktop\src-tauri\target\release\bundle\nsis"
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          if ($installers[0].Name -notmatch "LudusAtlas") {
            throw "Installer has an unexpected product name: $($installers[0].Name)."
          }

          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE ".deploy\preview"
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          $artifactName = "LudusAtlas-Preview-v$version-$shortSha.exe"
          $artifactPath = Join-Path $artifactDirectory $artifactName
          Copy-Item -LiteralPath $installers[0].FullName -Destination $artifactPath

          $sha256 = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256  $artifactName" | Set-Content -LiteralPath "$artifactPath.sha256" -Encoding utf8
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Windows preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudusAtlas-Windows-preview-v${{ steps.artifact.outputs.version }}-${{ github.run_number }}
          path: .deploy/preview/*
          if-no-files-found: error
          retention-days: 14
