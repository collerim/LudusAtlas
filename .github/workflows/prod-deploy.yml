name: Release LudusAtlas for Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version from tauri.conf.json, with or without the v prefix"
        required: true
        type: string

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.4"

jobs:
  release-windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check LudusAtlas fork boundaries
        run: node scripts/ci/check-fork-boundaries.mjs

      - name: Validate release version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:REF_NAME -ne "main") {
            throw "Manual releases must run from the main branch."
          }

          node scripts/ci/check-desktop-version-sync.mjs
          $configured = node scripts/ci/read-desktop-version.mjs
          $requested = $env:REQUESTED_VERSION.Trim()
          if ($requested.StartsWith("v")) {
            $requested = $requested.Substring(1)
          }

          if ($requested -ne $configured) {
            throw "Requested version $requested does not match configured desktop version $configured."
          }

          "version=$configured" >> $env:GITHUB_OUTPUT
          "tag=v$configured" >> $env:GITHUB_OUTPUT
          $isPrerelease = $configured.StartsWith("0.") -or $configured.Contains("-")
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Run tests and frontend builds
        run: pnpm turbo run test typecheck build

      - name: Build Windows NSIS installer
        run: |
          pnpm --filter @playcounter/shared build
          corepack pnpm --filter @playcounter/desktop exec tauri build --ci --bundles nsis

      - name: Stage installer and checksum
        id: artifact
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $application = Join-Path $env:GITHUB_WORKSPACE "apps\desktop\src-tauri\target\release\ludusatlas.exe"
          if (-not (Test-Path -LiteralPath $application -PathType Leaf)) {
            throw "Expected LudusAtlas executable at $application."
          }

          $bundle = Join-Path $env:GITHUB_WORKSPACE "apps\desktop\src-tauri\target\release\bundle\nsis"
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          if ($installers[0].Name -notmatch "LudusAtlas") {
            throw "Installer has an unexpected product name: $($installers[0].Name)."
          }

          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE ".deploy\release"
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          $releaseName = "LudusAtlas-Setup-v$($env:RELEASE_VERSION).exe"
          $releasePath = Join-Path $releaseDirectory $releaseName
          Copy-Item -LiteralPath $installers[0].FullName -Destination $releasePath

          $aliasName = "LudusAtlas-Setup.exe"
          $aliasPath = Join-Path $releaseDirectory $aliasName
          Copy-Item -LiteralPath $installers[0].FullName -Destination $aliasPath

          $sha256 = (Get-FileHash -LiteralPath $releasePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256  $releaseName" | Set-Content -LiteralPath "$releasePath.sha256" -Encoding utf8
          "$sha256  $aliasName" | Set-Content -LiteralPath "$aliasPath.sha256" -Encoding utf8
          "name=$releaseName" >> $env:GITHUB_OUTPUT
          "sha256=$sha256" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudusAtlas-Windows-v${{ steps.version.outputs.version }}
          path: .deploy/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Create LudusAtlas GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LudusAtlas v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            .deploy/release/${{ steps.artifact.outputs.name }}
            .deploy/release/${{ steps.artifact.outputs.name }}.sha256
            .deploy/release/LudusAtlas-Setup.exe
            .deploy/release/LudusAtlas-Setup.exe.sha256
          body: |
            Windows-first LudusAtlas development release.

            LudusAtlas is an independent project based on the open-source
            PlayCounter tracking core. It is not an official PlayCounter release.

            Download `${{ steps.artifact.outputs.name }}` and verify its SHA-256:

            `${{ steps.artifact.outputs.sha256 }}`

            This development installer is not yet Authenticode-signed, so Windows
            may display an unknown-publisher or SmartScreen warning.
